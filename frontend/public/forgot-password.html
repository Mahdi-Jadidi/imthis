<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
  <title>بازیابی رمز عبور — I’m This</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app-shell.css">
  <style>
    main.auth-main{min-height:calc(100dvh - 72px)}.recovery-panel{width:100%;max-width:560px;margin:48px auto;padding:32px}.recovery-lead{margin:0;color:var(--muted)}
    .recovery-steps{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:28px 0}.recovery-step{display:flex;align-items:center;gap:9px;padding:10px;border-radius:12px;color:var(--muted);font-size:13px;font-weight:700}.recovery-step b{display:grid;place-items:center;width:26px;height:26px;border-radius:999px;background:#e7efec;color:var(--muted)}.recovery-step.active{background:var(--brand-soft);color:var(--brand-dark)}.recovery-step.active b,.recovery-step.done b{background:var(--brand);color:#fff}
    .recovery-card{padding:22px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#fff,#f4fbf8)}.recovery-card h2{margin:0;font-size:21px}.recovery-card p{margin:7px 0 0;color:var(--muted);font-size:14px}.recovery-card .form-stack{display:grid;gap:16px;margin-top:22px}.recovery-card .btn{width:100%}.resend-row{margin-top:16px;text-align:center}#resetCountdown{min-height:24px;margin:10px 0 0;color:var(--muted);font-size:13px;font-weight:700}
    #resend:disabled,#requestCode:disabled,#savePassword:disabled{cursor:not-allowed;pointer-events:none;opacity:.58}.back{display:block;margin-top:22px;text-align:center;color:var(--brand);font-weight:800}
    .password-strength-root{margin-top:10px;min-height:160px}.password-strength-panel{position:relative;overflow:hidden;padding:14px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,#fff,#f8fbf9);box-shadow:0 16px 34px rgba(15,55,45,.06)}.password-strength-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;position:relative;z-index:1}.password-strength-copy{display:grid;gap:3px;min-width:0}.password-strength-title{font-size:13px;font-weight:800;color:var(--ink)}.password-strength-subtitle{font-size:12px;color:var(--muted);line-height:1.45}.password-strength-badge{display:inline-flex;align-items:center;padding:8px 11px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}.password-strength-track{height:10px;margin-top:12px;border-radius:999px;background:#e7efec;padding:2px;overflow:hidden;position:relative;z-index:1}.password-strength-fill{height:100%;border-radius:inherit;box-shadow:0 8px 18px rgba(15,110,86,.24)}.password-strength-hint{margin-top:10px;font-size:12px;color:var(--muted);line-height:1.5;position:relative;z-index:1}.password-strength-checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px;position:relative;z-index:1}.password-strength-check{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:12px;font-weight:700}.password-strength-check.is-on{border-color:rgba(15,110,86,.18);background:var(--brand-soft);color:var(--ink)}.password-strength-check-icon{width:18px;height:18px;border-radius:999px;display:grid;place-items:center;background:rgba(148,163,184,.22);color:#64748b;font-size:11px;font-weight:800}.password-strength-check.is-on .password-strength-check-icon{background:rgba(15,110,86,.16);color:var(--brand)}
    #resetNotice{width:min(420px,calc(100% - 32px));margin:auto;padding:24px;border:1px solid #9ddac6;border-radius:16px;background:#ecfdf3;color:#067647;box-shadow:0 24px 64px rgba(15,55,45,.24);font:inherit}#resetNotice.error{border-color:#f1c4c4;background:#fff5f5;color:#b42318}#resetNotice::backdrop{background:rgba(18,32,28,.42)}#resetNotice p{margin:0 0 18px;font-weight:700}#resetNotice button{width:100%}
    @media(max-width:560px){.recovery-panel{margin:18px auto;padding:24px}.recovery-step span{display:none}.recovery-steps{grid-template-columns:auto auto;justify-content:center}.password-strength-checks{grid-template-columns:1fr}}
  </style><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="emerald-aurora.css?v=101f108"><script src="theme.js"></script>
</head>
<body>
  <main class="container auth-main"><section class="card recovery-panel">
    <div class="top"><a class="brand" href="index.html"><img class="brand-mark" src="/logo.svg" alt="I’m This">I’m This</a><div class="actions"><span data-theme-slot></span><button class="language-toggle" data-lang-toggle>EN</button></div></div>
    <div class="eyebrow" data-fa="بازیابی امن" data-en="Secure recovery">بازیابی امن</div><h1 data-fa="رمز عبورتان را بازیابی کنید" data-en="Reset your password">رمز عبورتان را بازیابی کنید</h1><p class="recovery-lead" data-fa="در دو گام کوتاه، دسترسی حساب‌تان را برمی‌گردانیم." data-en="Restore access to your account in two short steps.">در دو گام کوتاه، دسترسی حساب‌تان را برمی‌گردانیم.</p>
    <div class="recovery-steps" aria-label="مراحل بازیابی رمز عبور"><div id="stepOne" class="recovery-step active"><b>1</b><span data-fa="ارسال کد" data-en="Send code">ارسال کد</span></div><div id="stepTwo" class="recovery-step"><b>2</b><span data-fa="رمز جدید" data-en="New password">رمز جدید</span></div></div>
    <section id="emailStep" class="recovery-card"><h2 data-fa="ایمیل حساب را وارد کنید" data-en="Enter your account email">ایمیل حساب را وارد کنید</h2><p data-fa="یک کد شش‌رقمی به ایمیل‌تان ارسال می‌کنیم." data-en="We’ll send a six-digit code to your email.">یک کد شش‌رقمی به ایمیل‌تان ارسال می‌کنیم.</p><form id="requestForm" class="form-stack"><div class="field"><label for="email" data-fa="ایمیل" data-en="Email">ایمیل</label><input id="email" type="email" autocomplete="email" required></div><button class="btn btn-primary" id="requestCode" type="submit" data-fa="ارسال کد بازیابی" data-en="Send recovery code">ارسال کد بازیابی</button></form></section>
    <section id="passwordStep" class="recovery-card" hidden><h2 data-fa="کد و رمز جدید را وارد کنید" data-en="Enter your code and new password">کد و رمز جدید را وارد کنید</h2><p data-fa="کد تا ۳۰ دقیقه معتبر است." data-en="The code is valid for 30 minutes.">کد تا ۳۰ دقیقه معتبر است.</p><form id="resetForm" class="form-stack"><div class="field"><label for="code" data-fa="کد بازیابی" data-en="Recovery code">کد بازیابی</label><input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9۰-۹٠-٩]{6}" maxlength="6" required></div><div class="field"><label for="password" data-fa="رمز جدید" data-en="New password">رمز جدید</label><input id="password" type="password" autocomplete="new-password" minlength="8" required aria-describedby="password-strength-root"><div id="password-strength-root" class="password-strength-root"></div></div><div class="field"><label for="passwordConfirmation" data-fa="تکرار رمز جدید" data-en="Confirm new password">تکرار رمز جدید</label><input id="passwordConfirmation" type="password" autocomplete="new-password" minlength="8" required></div><button class="btn btn-primary" id="savePassword" type="submit" data-fa="تغییر رمز عبور" data-en="Change password">تغییر رمز عبور</button></form><div class="resend-row"><button class="btn" id="resend" type="button" data-fa="ارسال دوباره کد" data-en="Resend code">ارسال دوباره کد</button><p id="resetCountdown" aria-live="polite"></p></div></section>
    <a class="back" href="login.html" data-fa="بازگشت به ورود" data-en="Back to sign in">بازگشت به ورود</a>
  </section></main>
  <dialog id="resetNotice" aria-labelledby="resetNoticeMessage"><p id="resetNoticeMessage" role="status" aria-live="polite"></p><button class="btn btn-primary" id="closeNotice" type="button" data-fa="متوجه شدم" data-en="Got it">متوجه شدم</button></dialog>
  <script src="site-config.js"></script><script src="i18n.js?v=20260903"></script><script src="dropcv-api.js"></script><script src="signup-strength.js"></script>
  <script>
    (function(){
      var email=document.getElementById('email'),emailStep=document.getElementById('emailStep'),passwordStep=document.getElementById('passwordStep'),requestButton=document.getElementById('requestCode'),resendButton=document.getElementById('resend'),countdown=document.getElementById('resetCountdown'),timer=null,cooldownMs=120000;
      function storageKey(){return'imthis_password_reset_until:'+String(email.value||'').trim().toLowerCase()}
      function notice(message,isError,afterClose){var dialog=document.getElementById('resetNotice');document.getElementById('resetNoticeMessage').textContent=message;dialog.className=isError?'error':'';dialog.__afterClose=afterClose||null;if(typeof dialog.showModal==='function')dialog.showModal();else dialog.setAttribute('open','')}
      document.getElementById('closeNotice').addEventListener('click',function(){var dialog=document.getElementById('resetNotice'),next=dialog.__afterClose;if(typeof dialog.close==='function')dialog.close();else dialog.removeAttribute('open');if(next)next()});
      function showPasswordStep(){emailStep.hidden=true;passwordStep.hidden=false;document.getElementById('stepOne').className='recovery-step done';document.getElementById('stepTwo').className='recovery-step active';document.getElementById('code').focus()}
      function renderCountdown(){var remaining=Math.max(0,Number(window.__imthisResetUntil||0)-Date.now());if(!remaining){resendButton.disabled=false;countdown.textContent='می‌توانید یک کد جدید درخواست کنید.';if(timer)clearInterval(timer);return}resendButton.disabled=true;var seconds=Math.ceil(remaining/1000);countdown.textContent='ارسال دوباره کد تا '+Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0')}
      function startCooldown(){window.__imthisResetUntil=Date.now()+cooldownMs;try{sessionStorage.setItem(storageKey(),String(window.__imthisResetUntil))}catch(error){}renderCountdown();if(timer)clearInterval(timer);timer=setInterval(renderCountdown,1000)}
      function restoreCooldown(){try{window.__imthisResetUntil=Number(sessionStorage.getItem(storageKey())||0)}catch(error){}renderCountdown();if(window.__imthisResetUntil>Date.now())timer=setInterval(renderCountdown,1000)}
      async function requestCode(isResend){if(!email.checkValidity()){email.reportValidity();return}var button=isResend?resendButton:requestButton;if(button.disabled)return;button.disabled=true;var response=await dropCVApi.requestPasswordReset(email.value);if(response.ok){showPasswordStep();startCooldown();notice('اگر این ایمیل در حساب‌های ما ثبت شده باشد، کد بازیابی ارسال شد.');return}button.disabled=false;if(response.status===429){showPasswordStep();startCooldown();notice('برای جلوگیری از ارسال تکراری، کمی صبر کنید و سپس دوباره تلاش کنید.',true);return}notice(response.error||'ارسال کد انجام نشد. اتصال اینترنت و تنظیمات سرویس ایمیل را بررسی کنید.',true)}
      document.getElementById('requestForm').addEventListener('submit',function(event){event.preventDefault();requestCode(false)});resendButton.addEventListener('click',function(){requestCode(true)});
      document.getElementById('resetForm').addEventListener('submit',async function(event){event.preventDefault();var password=document.getElementById('password').value;if(password!==document.getElementById('passwordConfirmation').value){notice('تکرار رمز عبور با رمز جدید یکسان نیست.',true);return}var save=document.getElementById('savePassword');save.disabled=true;var response=await dropCVApi.confirmPasswordReset(email.value,document.getElementById('code').value,password);save.disabled=false;if(response.ok){notice('رمز عبور شما با موفقیت تغییر کرد. اکنون می‌توانید وارد شوید.',false,function(){location.replace('login.html')});return}notice(response.error||'تغییر رمز انجام نشد.',true)});
      email.addEventListener('change',function(){if(!passwordStep.hidden)restoreCooldown()});
    })();
  </script>
</body>
</html>
