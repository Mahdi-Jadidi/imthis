<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>بازیابی رمز — imthis.site</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f7faf9;color:#12201c;font-family:Arial,sans-serif;display:grid;place-items:center;padding:24px}.card{width:min(560px,100%);background:#fff;border:1px solid #dce7e2;border-radius:18px;padding:32px;box-shadow:0 18px 50px rgba(15,55,45,.1)}.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:#12201c;font-weight:800;font-size:20px;margin-bottom:24px}.mark{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:#0f6e56;color:#fff}.eyebrow{color:#0f6e56;font-weight:700;margin-bottom:8px}h1{margin:0 0 10px;font-size:clamp(30px,6vw,46px);line-height:1.2}p{color:#5d6c67;line-height:1.7}.stack{display:grid;gap:14px;margin-top:22px}label{display:grid;gap:7px;font-weight:700}input{width:100%;padding:12px 14px;border:1px solid #dce7e2;border-radius:10px;font:inherit;background:#fff}button{width:100%;padding:13px;border:0;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;background:#0f6e56;color:#fff}button.secondary{background:#eaf7f2;color:#0a4f3f}.status{margin-top:14px;padding:10px;border-radius:10px}.status.success{background:#ecfdf3;color:#067647}.status.error{background:#fef3f2;color:#b42318}.back{display:block;text-align:center;margin-top:18px;color:#0f6e56}</style></head><body><main class="card"><a class="brand" href="login.html"><span class="mark">i</span>imthis.site</a><div class="eyebrow">بازیابی رمز عبور</div><h1>رمز عبور جدید بسازید</h1><p>ابتدا کد را به ایمیل خود ارسال کنید، سپس رمز جدید را وارد کنید.</p><div id="status" class="status" hidden role="alert"></div><form id="form" class="stack"><label>ایمیل<input id="email" type="email" autocomplete="email" required></label><label>کد بازیابی<input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></label><label>رمز عبور جدید<input id="password" type="password" autocomplete="new-password" minlength="8" required></label><button type="submit">تغییر رمز عبور</button></form><button id="request" class="secondary" type="button" style="margin-top:12px">ارسال کد بازیابی</button><a class="back" href="login.html">بازگشت به ورود</a></main><script src="site-config.js"></script><script src="dropcv-api.js"></script><script>(function(){var e=document.getElementById('email'),s=document.getElementById('status');function show(t,ok){s.hidden=false;s.textContent=t;s.className='status '+(ok?'success':'error')}document.getElementById('request').onclick=async function(){var r=await dropCVApi.requestPasswordReset(e.value);show(r.ok?'اگر حسابی وجود داشته باشد، کد بازیابی ارسال شد.':r.error||'ارسال انجام نشد.',r.ok)};document.getElementById('form').onsubmit=async function(x){x.preventDefault();var r=await dropCVApi.confirmPasswordReset(e.value,document.getElementById('code').value,document.getElementById('password').value);if(r.ok)location.replace('login.html');else show(r.error||'تغییر رمز انجام نشد.',false)}})();</script></body></html>
