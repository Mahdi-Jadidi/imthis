name: Backend CI and Production Smoke

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-and-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://unused:unused@127.0.0.1:5432/unused
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci-test-secret-only
      JWT_EXPIRES_IN: 7d
      MINIO_ENDPOINT: 127.0.0.1
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ci-test
      MINIO_SECRET_KEY: ci-test
      MINIO_BUCKET: ci-test
      FRONTEND_URL: http://localhost:8080
      ADMIN_EMAILS: admin@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-fund --no-audit
      - name: Check backend JavaScript syntax
        run: find src api scripts -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run billing, trial, payment, and site-generation unit tests
        run: npm run test:unit

  production-smoke:
    needs: unit-and-syntax
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify non-mutating Production API contract
        run: npm run test:production
